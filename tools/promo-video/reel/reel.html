<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<script src="assets/icons.js"></script>
<script src="vo_timing.js"></script>
<style>
  @font-face { font-family: "Geist"; src: url(assets/geist-latin.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "GeistMono"; src: url(assets/geist-mono-latin.woff2) format("woff2"); }
  @font-face { font-family: "NotoKR"; src: url(assets/NotoSansKR.ttf) format("truetype"); font-weight: 100 900; }
  :root {
    --fg: #0a0a0a; --muted: #858585; --bg: #ffffff; --soft: #f5f5f5; --border: #e5e5e5;
    --red: #e7000b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "Geist", "NotoKR", sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .kr { font-family: "NotoKR", sans-serif; }
  .mono { font-family: "GeistMono", monospace; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #fff; }
  #cam { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; overflow: hidden; display: none; }
  .abs { position: absolute; }
  .center { left: 50%; top: 50%; }
  svg { display: block; width: 100%; height: 100%; }

  .h { font-size: 118px; line-height: 1.02; font-weight: 500; letter-spacing: -0.065em; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.12em 0.14em 0; margin-right: -0.12em; margin-bottom: -0.14em; }
  .w > span { display: inline-block; will-change: transform; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: 26px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 22px; }
  .eyebrow .line { height: 2px; width: 70px; background: currentColor; transform-origin: left; }

  .card { background: #fff; border: 2px solid var(--border); border-radius: 36px; box-shadow: 0 30px 80px rgb(0 0 0 / 0.10), 0 2px 4px rgb(0 0 0 / 0.04); }
  .badge-red { background: rgb(231 0 11 / 0.1); color: var(--red); box-shadow: inset 0 0 0 2px rgb(231 0 11 / 0.15); border-radius: 26px; display: grid; place-items: center; }
  .chip { display: flex; align-items: center; gap: 20px; padding: 22px 34px 22px 24px; border-radius: 999px; font-size: 38px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
  .chip .ic { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; padding: 15px; }
  .grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: overlay; opacity: 0.07; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam"></div>
  <canvas id="grain" class="grain" width="360" height="640"></canvas>
  <div id="vignette" class="abs" style="inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 62%, rgb(0 0 0 / 0.14) 100%)"></div>
  <div id="flash" class="abs" style="inset:0;background:#fff;opacity:0;pointer-events:none"></div>
</div>
<script>
// ---------- timing & helpers ----------
const BPM = 128, B = 60 / BPM;
// The animation is authored on a 64-beat grid. Holds stretch it so each
// voiceover line plays at natural speed: every design beat at or after a
// hold's `at` moves later by `extra` beats, so entrances keep their speed and
// the scene waits before its exit. `b()` maps a design beat to seconds;
// `d()` converts a beat *duration* to seconds and is never stretched.
const HOLDS = [];
const warpBeat = (x) => x + HOLDS.reduce((s, h) => s + (h.at <= x ? h.extra : 0), 0);
const b = (n) => warpBeat(n) * B;
const d = (n) => n * B;
const VO = window.VO_LINES || [];
// Holds are whole beats so the music grid stays intact.
const holdUntil = (at, seconds) => {
  const short = (seconds - b(at)) / B;
  if (short > 0) HOLDS.push({ at, extra: Math.ceil(short) });
};
for (const line of VO) {
  // anchors: the element at `at` waits for its word (lead it by 0.1s)
  for (const a of line.anchors || []) holdUntil(a.at, b(line.start) + a.sec - 0.1);
  holdUntil(line.holdAt, b(line.start) + line.dur + 0.3);
}
const DURATION = b(64);
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, x) => a + (c - a) * x;
const P = (t, start, dur) => clamp((t - start) / dur);
const E = {
  outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inExpo: (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10)),
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  inOutExpo: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2),
  outBack: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outElastic: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
};
const cam = document.getElementById("cam");
const h = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const icon = (name, color = "currentColor", sw) => {
  let s = ICONS[name].replace('stroke="currentColor"', `stroke="${color}"`);
  if (sw) s = s.replace('stroke-width="1.75"', `stroke-width="${sw}"`);
  return s;
};
const set = (el, s) => { for (const k in s) el.style[k] = s[k]; };
// Seeded noise for shake/grain so every render is identical.
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Words that mask-reveal upward. `lines` = [[text, muted?], ...]
function headline(lines, cls = "h") {
  const root = h(`<div class="${cls}"></div>`);
  const words = [];
  for (const [text, muted] of lines) {
    const line = h(`<div${muted ? ' class="muted"' : ""}></div>`);
    text.split(" ").forEach((word, i) => {
      const w = h(`<span class="w"><span>${word}</span></span>`);
      line.appendChild(w);
      if (i < text.split(" ").length - 1) line.appendChild(document.createTextNode(" "));
      words.push(w.firstElementChild);
    });
    root.appendChild(line);
  }
  root.reveal = (t, start, step, out) => {
    words.forEach((w, i) => {
      const x = E.outExpo(P(t, start + i * step, 0.55));
      let y = (1 - x) * 115, r = (1 - x) * 8;
      if (out !== undefined) { const o = E.inExpo(P(t, out + i * 0.02, 0.3)); y -= o * 115; }
      w.style.transform = `translateY(${y}%) rotate(${r}deg)`;
    });
  };
  root.words = words;
  return root;
}

// ---------- sound cue list (read by render.mjs -> audio.py) ----------
const SFX = [];
const sfx = (t, type, gain = 1) => SFX.push({ t: +t.toFixed(4), type, gain });

// Camera shake impulses.
const IMPULSES = [];
const shake = (t, amp) => IMPULSES.push({ t, amp });

// Flash frames.
const FLASHES = [];
const flash = (t, dur = 0.25, color = "#fff", peak = 1) => FLASHES.push({ t, dur, color, peak });

const scenes = [];
function scene(start, end, bg, build) {
  const root = h(`<div class="scene" style="background:${bg}"></div>`);
  cam.appendChild(root);
  const update = build(root);
  scenes.push({ start, end, root, update });
}

// =====================================================================
// S1 — problems (beats 0–8)
// =====================================================================
scene(0, b(8), "#f4f4f5", (root) => {
  root.appendChild(h(`<div class="abs" style="inset:0;background-image:linear-gradient(#e4e4e7 2px,transparent 2px),linear-gradient(90deg,#e4e4e7 2px,transparent 2px);background-size:90px 90px;opacity:.55"></div>`));
  const eyebrow = h(`<div class="abs eyebrow" style="left:80px;top:250px;color:#52525b;font-size:30px"><span class="line"></span><span>Punya kelas bahasa Korea?</span></div>`);
  root.appendChild(eyebrow);
  const problems = [
    ["FileText", "Materi masih pakai PDF", "Murid buka file satu per satu, tanpa urutan."],
    ["ClipboardList", "Kuis manual di Google Form", "Nilai direkap manual, tanpa riwayat murid."],
    ["MessagesSquare", "Belajar di grup WhatsApp", "Materi dan info tenggelam di chat."],
  ];
  const layout = [
    { x: 540, y: 600, r: -4 }, { x: 560, y: 960, r: 3 }, { x: 525, y: 1320, r: -2.5 },
  ];
  const cards = problems.map(([ic, title, detail], i) => {
    const c = h(`<div class="abs card" style="width:900px;padding:40px 44px;left:0;top:0;display:flex;gap:34px;align-items:center">
      <div class="badge-red" style="width:112px;height:112px;flex:none;padding:28px">${icon(ic)}</div>
      <div><div style="font-size:50px;font-weight:500;letter-spacing:-0.03em;line-height:1.1">${title}</div>
      <div style="font-size:31px;color:#737373;margin-top:10px;line-height:1.3">${detail}</div></div>
      <div class="mono abs" style="right:34px;top:26px;font-size:22px;color:#a3a3a3;letter-spacing:.18em">0${i + 1}</div></div>`);
    root.appendChild(c);
    return c;
  });
  const big = h(`<div class="abs" style="left:0;right:0;top:760px;text-align:center;font-size:250px;font-weight:600;letter-spacing:-0.07em;line-height:.9;color:var(--red)">Ribet<br/><span style="color:var(--fg)">ga sih?</span></div>`);
  root.appendChild(big);
  const redX = h(`<div class="abs" style="left:0;top:0;right:0;bottom:0;pointer-events:none"></div>`);
  root.appendChild(redX);

  cards.forEach((_, i) => { sfx(b(i) + (i === 0 ? 0.02 : 0), "impact", 0.9); shake(b(i) + 0.1, 16); });
  sfx(b(4), "boom", 1.2); shake(b(4) + 0.05, 34);
  sfx(b(4.5), "riser", 1);
  [6, 6.5, 7, 7.25, 7.5, 7.75].forEach((x) => sfx(b(x), "glitch", 0.55));
  flash(b(8) - 0.02, 0.35);

  return (t) => {
    eyebrow.querySelector(".line").style.transform = `scaleX(${E.outExpo(P(t, 0, 0.6))})`;
    eyebrow.style.opacity = 1 - E.inCubic(P(t, b(3.8), 0.3));
    cards.forEach((c, i) => {
      const L = layout[i];
      const s = P(t, b(i) - 0.06, 0.28);
      const x = E.outExpo(s);
      const scale = lerp(1.9, 1, x);
      const blurIn = (1 - x) * 18;
      // after "Ribet, kan?" the cards get pushed back and darkened
      const back = E.outExpo(P(t, b(4), 0.5));
      const jitter = t > b(6) ? (hash(Math.floor(t * 30) + i * 13) - 0.5) * 40 * P(t, b(6), d(2)) : 0;
      const sc = scale * lerp(1, 0.86, back);
      c.style.opacity = s <= 0 ? 0 : Math.min(1, s * 4);
      c.style.transform = `translate(${L.x - 450 + jitter}px, ${L.y - 110 + back * (L.y > 960 ? 60 : -60)}px) rotate(${L.r + (1 - x) * 12 + back * L.r}deg) scale(${sc})`;
      c.style.filter = `blur(${blurIn + back * 7}px) brightness(${1 - back * 0.12})`;
    });
    const bs = P(t, b(4) - 0.05, 0.3);
    const bx = E.outBack(bs);
    const glitch = t > b(6) ? P(t, b(6), d(2)) : 0;
    const gj = glitch ? (hash(Math.floor(t * 24)) - 0.5) * 60 * glitch : 0;
    big.style.opacity = bs > 0 ? 1 : 0;
    big.style.transform = `translateX(${gj}px) scale(${lerp(2.4, 1, bx) + P(t, b(4), d(4)) * 0.12}) rotate(${(1 - bx) * -6}deg)`;
    big.style.textShadow = glitch ? `${14 * glitch}px 0 rgb(0 200 255 / .7), ${-14 * glitch}px 0 rgb(255 0 80 / .7)` : "none";
    // pre-drop zoom into the text
    const z = E.inExpo(P(t, b(7.5), d(0.5)));
    root.style.transform = `scale(${1 + z * 0.5})`;
    root.style.filter = z ? `blur(${z * 10}px)` : "none";
  };
});

// =====================================================================
// S2 — hero headline (beats 8–14)
// =====================================================================
scene(b(8), b(14), "#ffffff", (root) => {
  const blob = h(`<div class="abs" style="width:1100px;height:1100px;border-radius:50%;background:rgb(23 23 23 / .09);filter:blur(90px);left:300px;top:-200px"></div>`);
  const blob2 = h(`<div class="abs" style="width:800px;height:800px;border-radius:50%;background:rgb(23 23 23 / .06);filter:blur(80px);left:-300px;top:1200px"></div>`);
  root.append(blob, blob2);
  const eyebrow = h(`<div class="abs eyebrow" style="left:80px;top:560px"><span class="line" style="background:var(--fg)"></span><span>LMS untuk kelas bahasa Korea</span></div>`);
  root.appendChild(eyebrow);
  const hl = headline([["Sekarang,"], ["kelola semua"], ["di satu", true], ["tempat.", true]]);
  hl.classList.add("abs");
  set(hl, { left: "76px", top: "650px", fontSize: "146px" });
  root.appendChild(hl);
  const underline = h(`<div class="abs" style="left:80px;top:1270px;height:14px;width:720px;background:var(--fg);transform-origin:left;border-radius:8px"></div>`);
  root.appendChild(underline);
  const sub = h(`<div class="abs" style="left:80px;top:1360px;width:900px;font-size:40px;line-height:1.35;color:#737373">Kurikulum, group belajar, aplikasi murid, dan tryout dalam satu platform siap pakai.</div>`);
  root.appendChild(sub);

  sfx(b(8), "impact", 1.1); shake(b(8) + 0.05, 20);
  hl.words.forEach((_, i) => sfx(b(8.25) + i * d(0.5), "tick", 0.8));
  sfx(b(11.9), "swipe", 0.8);
  sfx(b(13.2), "whooshUp", 1);

  return (t) => {
    const lt = t - b(8);
    blob.style.transform = `translate(${Math.sin(lt * 1.2) * 60}px, ${lt * 30}px) scale(${1 + lt * 0.05})`;
    blob2.style.transform = `translate(${lt * 40}px, ${-lt * 40}px)`;
    eyebrow.querySelector(".line").style.transform = `scaleX(${E.outExpo(P(t, b(8), 0.6))})`;
    eyebrow.style.opacity = P(t, b(8), 0.2);
    hl.reveal(t, b(8.25), d(0.5));
    const zoom = E.inOutCubic(P(t, b(8), d(6)));
    hl.style.transform = `scale(${1 + zoom * 0.05})`;
    hl.style.transformOrigin = "0 0";
    underline.style.transform = `scaleX(${E.outExpo(P(t, b(11.9), 0.5))})`;
    const sp = E.outExpo(P(t, b(12.2), 0.6));
    sub.style.opacity = sp; sub.style.transform = `translateY(${(1 - sp) * 40}px)`;
  };
});

// =====================================================================
// S3 — logo reveal (beats 14–18). An iris opens into black.
// =====================================================================
scene(b(13.5), b(18), "transparent", (root) => {
  const iris = h(`<div class="abs" style="left:540px;top:960px;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#0a0a0a"></div>`);
  root.appendChild(iris);
  const wrap = h(`<div class="abs" style="inset:0"></div>`);
  root.appendChild(wrap);
  const kr = h(`<div class="abs kr" style="left:0;right:0;top:470px;text-align:center;font-size:560px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:3px rgb(255 255 255 / .22);letter-spacing:-0.02em">학교</div>`);
  wrap.appendChild(kr);
  const rings = [0, 1, 2].map(() => { const r = h(`<div class="abs" style="left:540px;top:960px;width:400px;height:400px;margin:-200px 0 0 -200px;border-radius:50%;border:4px solid #fff"></div>`); wrap.appendChild(r); return r; });
  const logo = h(`<div class="abs" style="left:0;right:0;top:860px;text-align:center;color:#fff;font-size:250px;font-weight:600;letter-spacing:-0.06em;line-height:1">hakgyo</div>`);
  wrap.appendChild(logo);
  const tag = h(`<div class="abs" style="left:0;right:0;top:1180px;text-align:center;color:rgb(255 255 255 / .7);font-size:42px;letter-spacing:0.02em"><span class="kr" style="color:#fff">학교</span> &nbsp;=&nbsp; sekolah</div>`);
  const tag2 = h(`<div class="abs mono" style="left:0;right:0;top:1270px;text-align:center;color:rgb(255 255 255 / .5);font-size:26px;letter-spacing:.3em;text-transform:uppercase">LMS kelas bahasa Korea</div>`);
  wrap.append(tag, tag2);
  sfx(b(14), "boom", 1.3); shake(b(14) + 0.05, 30);
  sfx(b(15), "pop", 0.7); sfx(b(16), "pop", 0.7);
  sfx(b(17.55), "whoosh", 1);

  return (t) => {
    const ip = E.inOutExpo(P(t, b(13.5), d(0.5)));
    iris.style.transform = `scale(${ip * 460})`;
    const lp = P(t, b(14) - 0.04, 0.4);
    const lx = E.outExpo(lp);
    logo.style.opacity = lp > 0 ? 1 : 0;
    logo.style.transform = `scale(${lerp(3.2, 1, lx) + P(t, b(14), d(4)) * 0.08})`;
    logo.style.filter = `blur(${(1 - lx) * 24}px)`;
    logo.style.letterSpacing = `${lerp(0.1, -0.06, lx)}em`;
    kr.style.opacity = E.outCubic(P(t, b(14), 0.6));
    kr.style.transform = `scale(${1.25 - E.outCubic(P(t, b(14), d(4))) * 0.2})`;
    rings.forEach((r, i) => {
      const rp = P(t, b(14) + i * 0.09, 1.1);
      r.style.opacity = rp > 0 && rp < 1 ? (1 - rp) * 0.8 : 0;
      r.style.transform = `scale(${0.6 + E.outExpo(rp) * (2.4 + i * 0.6)})`;
      r.style.borderWidth = `${6 * (1 - rp) + 1}px`;
    });
    [tag, tag2].forEach((el, i) => {
      const p = E.outExpo(P(t, b(15 + i), 0.5));
      el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 40}px)`;
    });
    // whip-pan out to the left
    const out = E.inExpo(P(t, b(17.5), d(0.5)));
    wrap.style.transform = `translateX(${-out * 1300}px) skewX(${out * 12}deg)`;
    wrap.style.filter = out ? `blur(${out * 30}px)` : "none";
  };
});

// =====================================================================
// S4 — teacher dashboard (beats 18–26)
// =====================================================================
scene(b(18), b(26), "#f5f5f5", (root) => {
  const hl = headline([["Learning platform,"], ["semua di satu", true], ["tempat.", true]]);
  hl.classList.add("abs");
  set(hl, { left: "76px", top: "230px", fontSize: "120px" });
  root.appendChild(hl);
  const persp = h(`<div class="abs" style="left:0;right:0;top:720px;height:1100px;perspective:2200px"></div>`);
  root.appendChild(persp);
  const shot = h(`<div class="abs" style="left:60px;width:960px;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 60px 120px rgb(0 0 0 / .18),0 0 0 2px #e5e5e5;transform-origin:50% 0">
     <div style="height:62px;background:#fafafa;border-bottom:2px solid #eee;display:flex;align-items:center;gap:12px;padding:0 26px">
       <i style="width:18px;height:18px;border-radius:50%;background:#e5e5e5"></i><i style="width:18px;height:18px;border-radius:50%;background:#e5e5e5"></i><i style="width:18px;height:18px;border-radius:50%;background:#e5e5e5"></i>
       <div class="mono" style="margin-left:24px;font-size:22px;color:#a3a3a3;background:#f0f0f0;border-radius:99px;padding:6px 22px">hakgyo · pembuat kurikulum</div></div>
     <img src="assets/curriculum-light.jpg" style="display:block;width:960px"/></div>`);
  persp.appendChild(shot);
  const hi = h(`<div class="abs" style="left:24px;top:360px;width:912px;height:226px;border-radius:30px;border:5px solid var(--fg);opacity:0"></div>`);
  shot.appendChild(hi);
  const chips = [
    ["BookOpen", "Kurikulum", 70, 1130, "#0a0a0a", "#fff"],
    ["Calendar", "Jadwal kelas", 330, 1310, "#fff", "#0a0a0a"],
    ["UsersRound", "Grouping murid", 120, 1490, "#0a0a0a", "#fff"],
  ].map(([ic, text, x, y, bg, fg]) => {
    const c = h(`<div class="abs chip" style="left:${x}px;top:${y}px;background:${bg};color:${fg};box-shadow:0 24px 60px rgb(0 0 0 / .25)">
      <span class="ic" style="background:${fg === "#fff" ? "rgb(255 255 255 / .14)" : "#f0f0f0"}">${icon(ic, fg, 2)}</span>${text}</div>`);
    root.appendChild(c);
    return c;
  });
  sfx(b(18), "impact", 0.9); shake(b(18) + 0.05, 12);
  hl.words.forEach((_, i) => sfx(b(18) + i * d(0.34), "tick", 0.6));
  sfx(b(19.3), "whooshUp", 0.8);
  chips.forEach((_, i) => sfx(b(21 + i * 1.5), "pop", 1));
  sfx(b(20.5), "click", 0.8);
  sfx(b(25.5), "whoosh", 1);

  return (t) => {
    hl.reveal(t, b(18), d(0.34), b(25.5));
    const sp = E.outExpo(P(t, b(19.2), 0.9));
    const drift = E.inOutCubic(P(t, b(20), d(5.5)));
    const out = E.inExpo(P(t, b(25.5), d(0.5)));
    shot.style.transform = `translateY(${(1 - sp) * 900 - drift * 120 - out * 1400}px) rotateX(${lerp(48, 12, sp) - drift * 8}deg) rotateZ(${(1 - sp) * -6}deg) scale(${lerp(0.8, 1, sp) + drift * 0.08})`;
    shot.style.opacity = P(t, b(19.2), 0.1);
    const hp = P(t, b(20.5), 0.35);
    hi.style.opacity = hp > 0 ? 1 - P(t, b(24.5), 0.3) : 0;
    hi.style.transform = `scale(${lerp(1.15, 1, E.outBack(hp))})`;

    const bp = P(t, b(58.6) - 0.05, 0.5);
    const move = E.inOutExpo(P(t, b(59.75), 0.5));
    const bw = btn.offsetWidth, bh = btn.offsetHeight;
    btnWrap.style.left = `${lerp(80, 540 - bw / 2, move)}px`;
    btnWrap.style.top = `${lerp(1200, 1160, move)}px`;
    btnWrap.style.width = `${bw}px`; btnWrap.style.height = `${bh}px`;
    btn.style.opacity = bp > 0 ? 1 : 0;
    btn.style.transformOrigin = move > 0.5 ? "center" : "left center";
    btn.style.transform = `scale(${lerp(0.3, 1, E.outElastic(bp)) + (t > b(60) ? Math.exp(-(t - b(60)) * 8) * 0.08 : 0)})`;
    pulses.forEach((p, i) => {
      const cyc = (t - b(61) - i * B) / d(2);
      const ph = cyc - Math.floor(cyc);
      p.style.opacity = t > b(61) + i * B ? (1 - ph) * 0.6 : 0;
      p.style.transform = `scale(${1 + ph * 0.3}, ${1 + ph * 0.9})`;
    });
    shine.style.transform = `translateX(${lerp(-200, 900, E.inOutCubic(P(t, b(61.25), 0.7)))}px) skewX(-20deg)`;

    // logo slam
    const lp = P(t, b(60) - 0.04, 0.45);
    const lx = E.outBack(lp);
    logo.style.opacity = lp > 0 ? 1 : 0;
    logo.style.transform = `scale(${lerp(2.6, 1, lx)}) rotate(${(1 - lx) * -18}deg)`;
    logo.style.filter = `blur(${(1 - E.outExpo(lp)) * 20}px)`;
    rings.forEach((r, i) => {
      const rp = P(t, b(60) + i * 0.1, 1.0);
      r.style.opacity = rp > 0 && rp < 1 ? (1 - rp) * 0.7 : 0;
      r.style.transform = `scale(${0.7 + E.outExpo(rp) * (2.2 + i * 0.6)})`;
    });
    glow.style.opacity = E.outCubic(P(t, b(60), 0.8));
    const wp = E.outExpo(P(t, b(60.25), 0.6));
    word.style.opacity = wp;
    word.style.transform = `translateY(${(1 - wp) * 80}px)`;
    word.style.letterSpacing = `${lerp(0.08, -0.06, wp)}em`;
    const tp = E.outExpo(P(t, b(60.75), 0.6));
    tag.style.opacity = tp; tag.style.transform = `translateY(${(1 - tp) * 30}px)`;
    // final gentle push-in
    root.style.transform = `scale(${1 + E.inOutCubic(P(t, b(60), d(4))) * 0.04})`;
  };
});

// ---------- render loop ----------
const grain = document.getElementById("grain"), gctx = grain.getContext("2d");
const gimg = gctx.createImageData(360, 640);
function drawGrain(frame) {
  let seed = frame * 9973 + 1;
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) {
    seed = (seed * 16807) % 2147483647;
    const v = (seed / 2147483647) * 255;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  gctx.putImageData(gimg, 0, 0);
}
const flashEl = document.getElementById("flash");
VO.forEach((line) => SFX.push({ t: +b(line.start).toFixed(4), type: "vo", file: line.file, gain: 1 }));
window.SFX = SFX;
window.HOLDS = HOLDS;
window.MUSIC = {
  total: warpBeat(64), drop1: warpBeat(8), roll1: warpBeat(6), arp: warpBeat(16), lift: warpBeat(44),
  build: warpBeat(52), roll2: warpBeat(54), drop2: warpBeat(56), end: warpBeat(60),
  crashes: [8, 26, 44, 56].map(warpBeat),
};
window.DURATION = DURATION;
window.seek = (t, frame = Math.round(t * 30)) => {
  for (const s of scenes) {
    const on = t >= s.start && t < s.end;
    s.root.style.display = on ? "block" : "none";
    if (on) s.update(t);
  }
  let sx = 0, sy = 0, rot = 0;
  for (const { t: it, amp } of IMPULSES) {
    const d = t - it;
    if (d < 0 || d > 0.6) continue;
    const k = amp * Math.exp(-d * 9);
    sx += Math.sin(d * 90 + it) * k; sy += Math.cos(d * 75 + it * 3) * k * 0.8; rot += Math.sin(d * 60) * k * 0.02;
  }
  cam.style.transform = `translate(${sx}px, ${sy}px) rotate(${rot}deg)`;
  let fo = 0, fc = "#fff";
  for (const f of FLASHES) { const d = t - f.t; if (d >= 0 && d < f.dur) { fo = Math.max(fo, f.peak * (1 - d / f.dur) ** 2); fc = f.color; } }
  flashEl.style.opacity = fo; flashEl.style.background = fc;
  drawGrain(frame);
};
window.ready = Promise.all(["400 40px NotoKR", "700 100px NotoKR", "800 100px NotoKR", "600 60px GeistMono", "400 30px GeistMono"].map((f) => document.fonts.load(f, "학교한글가나다라마바사아자ㄱㄴㄷㅎ어부말 0123"))).then(() => document.fonts.ready).then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {})))).then(() => true);
seek(0);
</script>
