<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<script src="assets/icons.js"></script>
<style>
  @font-face { font-family: "Geist"; src: url(assets/geist-latin.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "GeistMono"; src: url(assets/geist-mono-latin.woff2) format("woff2"); }
  @font-face { font-family: "NotoKR"; src: url(assets/NotoSansKR.ttf) format("truetype"); font-weight: 100 900; }
  :root { --fg: #0a0a0a; --muted: #737373; --soft: #f5f5f5; --border: #e5e5e5; --red: #e7000b; --green: #16a34a; --blue: #2563eb; --amber: #d97706; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: "Geist", "NotoKR", sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .kr { font-family: "NotoKR", sans-serif; }
  .mono { font-family: "GeistMono", monospace; }
  .abs { position: absolute; }
  svg { display: block; width: 100%; height: 100%; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #f4f4f5; }
  #bg { position: absolute; inset: 0; background-image: linear-gradient(#e7e7ea 1.5px, transparent 1.5px), linear-gradient(90deg, #e7e7ea 1.5px, transparent 1.5px); background-size: 64px 64px; opacity: .55; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); background: rgb(23 23 23 / .08); }
  .layer { position: absolute; inset: 0; display: none; }
  .kicker { font-family: "GeistMono", monospace; font-size: 18px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 16px; }
  .kicker .rule { width: 48px; height: 2px; background: currentColor; }
  .h1 { font-weight: 500; letter-spacing: -0.06em; line-height: 1.02; }
  .muted { color: #8a8a8a; }
  .card { background: #fff; border: 2px solid var(--border); border-radius: 28px; box-shadow: 0 24px 60px rgb(0 0 0 / .08), 0 2px 4px rgb(0 0 0 / .04); }
  .icon-box { display: grid; place-items: center; border-radius: 20px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .1em .12em 0; margin: 0 -.1em -.12em 0; }
  .w > span { display: inline-block; }
  /* desktop window */
  .win { position: absolute; left: 216px; top: 46px; width: 1488px; height: 930px; border-radius: 22px; overflow: hidden; background: #fff;
         box-shadow: 0 40px 100px rgb(0 0 0 / .18), 0 0 0 1.5px rgb(0 0 0 / .08); }
  .win .bar { position: absolute; left: 0; right: 0; top: 0; height: 0; }
  .win .view { position: absolute; inset: 0; overflow: hidden; }
  .win video, .phone video { position: absolute; display: block; }
  .phone { position: absolute; left: 1206px; top: 36px; width: 448px; height: 928px; border-radius: 64px; background: #111; padding: 16px;
           box-shadow: 0 40px 100px rgb(0 0 0 / .28), 0 0 0 2px #2a2a2a; }
  .phone .screen { position: relative; width: 416px; height: 896px; border-radius: 50px; overflow: hidden; background: #fff; }
  #caption { position: absolute; left: 0; right: 0; top: 990px; height: 80px; display: flex; justify-content: center; align-items: center; pointer-events: none; }
  #caption .box { max-width: 1500px; padding: 12px 26px; border-radius: 18px; background: rgb(10 10 10 / .86); color: #fff; font-size: 31px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; text-align: center; }
  #caption .box span { transition: none; }
  #chapterTag { position: absolute; left: 216px; top: 8px; height: 32px; }
  #ffBadge { position: absolute; top: 8px; right: 216px; height: 32px; }
  #grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: overlay; opacity: .05; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="blob" id="blob1" style="width:900px;height:900px;left:1100px;top:-300px"></div>
  <div class="blob" id="blob2" style="width:700px;height:700px;left:-250px;top:600px"></div>
  <div id="layers"></div>
  <div id="chapterTag"></div>
  <div id="ffBadge"></div>
  <div id="caption"><div class="box"></div></div>
  <canvas id="grain" width="480" height="270"></canvas>
  <div id="flash"></div>
</div>
<script>
// ---------------- helpers ----------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, s, d) => clamp((t - s) / d);
const E = {
  outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inExpo: (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10)),
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outBack: (x) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const h = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const icon = (name, color = "currentColor", sw = 1.75) =>
  ICONS[name].replace('stroke="currentColor"', `stroke="${color}"`).replace('stroke-width="1.75"', `stroke-width="${sw}"`);
const set = (el, s) => Object.assign(el.style, s);
const pop = (el, t, at, { dy = 40, scale = 0.92, dur = 0.55 } = {}) => {
  const p = E.outExpo(P(t, at, dur));
  el.style.opacity = P(t, at, 0.12);
  el.style.transform = `translateY(${(1 - p) * dy}px) scale(${lerp(scale, 1, E.outBack(P(t, at, dur)))})`;
  return p;
};
const wordsReveal = (root, text, cls = "") => {
  root.innerHTML = text.split(" ").map((w) => `<span class="w ${cls}"><span>${w}</span></span>`).join(" ");
  return [...root.querySelectorAll(".w > span")];
};
const revealWords = (spans, t, at, step = 0.07) =>
  spans.forEach((s, i) => { const p = E.outExpo(P(t, at + i * step, 0.55)); s.style.transform = `translateY(${(1 - p) * 110}%)`; });

const SFX = [];
const sfx = (t, type, gain = 1) => SFX.push({ t: +t.toFixed(3), type, gain });

// ---------------- data & timeline ----------------
const LEAD = 0.3, TAIL = 0.55, XF = 0.4, FPS = 30;
let SB, VO, CLIPS = {}, TL = [], SHOTS = [], DURATION = 0;

async function load() {
  const j = (u) => fetch(u).then((r) => r.json());
  SB = await j("storyboard.json");
  VO = await j("vo_timing.json");
  const names = [...new Set(SB.segments.filter((s) => s.v.type === "clip").map((s) => s.v.clip))];
  for (const n of names) {
    CLIPS[n] = await j(`clips/${n}.json`);
    CLIPS[n].cam = await fetch(`clips/${n}.cam.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  }
}

function markTime(clip, m) {
  if (typeof m === "number") return m;
  if (m === "end") return CLIPS[clip].duration - 0.2;
  const found = CLIPS[clip].marks.find((x) => x.name === m);
  if (!found) throw new Error(`mark ${m} not in ${clip}`);
  return found.t;
}

/** Word start time (seconds into the segment's speech) of the first word matching re. */
function wordAt(id, re) {
  const w = VO[id].words.find((x) => re.test(x.w));
  return w ? w.s : 0;
}

function buildTimeline() {
  let t = 0;
  for (const seg of SB.segments) {
    const vo = VO[seg.id];
    const v = seg.v;
    let voOffset = LEAD, dur = LEAD + vo.dur + TAIL;
    if (v.type === "intro") { voOffset = 1.6; dur = voOffset + vo.dur + 0.8; }
    if (v.type === "chapter") dur = Math.max(dur + 0.3, 3.0);
    if (v.type === "outro") dur = LEAD + vo.dur + 3.2;
    if (["concept", "price", "payflow", "joins", "anatomy", "list", "compare"].includes(v.type)) dur += 0.6;
    const item = { seg, id: seg.id, v, start: t, voAt: 0, dur, voOffset };
    if (v.type === "clip") {
      const from = markTime(v.clip, v.from), to = markTime(v.clip, v.to);
      // `cuts` ([[fromMark, toMark], ...]) are skipped, e.g. waiting for an upload or an AI reply
      const cuts = (v.cuts ?? []).map(([a, b]) => [markTime(v.clip, a), markTime(v.clip, b)]).filter(([a, b]) => b > a && a >= from && b <= to).sort((x, y) => x[0] - y[0]);
      const ivs = [];
      let cursor = from;
      for (const [a, b] of cuts) { if (a > cursor) ivs.push([cursor, a]); cursor = Math.max(cursor, b); }
      if (to > cursor) ivs.push([cursor, to]);
      const span = Math.max(0.1, ivs.reduce((sum, [a, b]) => sum + (b - a), 0));
      const base = dur;
      const maxRate = v.maxRate ?? 2.5;
      let rate = clamp(span / base, 0.6, maxRate);
      dur = Math.max(base, span / maxRate);
      Object.assign(item, { from, to, span, rate, dur, ivs });
    }
    item.voAt = t + voOffset;
    TL.push(item);
    t += dur;
  }
  DURATION = t;
  // consecutive segments showing the same thing share one layer
  const key = (it) => (it.v.type === "clip" ? `clip:${it.v.clip}:${it.v.device || "desktop"}` : it.v.type === "joins" ? "joins" : `${it.v.type}:${it.id}`);
  for (const it of TL) {
    const k = key(it);
    const last = SHOTS[SHOTS.length - 1];
    if (last && last.key === k) { last.items.push(it); last.end = it.start + it.dur; }
    else SHOTS.push({ key: k, items: [it], start: it.start, end: it.start + it.dur });
  }
  // chapter for each item
  let ch = null;
  for (const it of TL) { if (it.v.type === "chapter") ch = it.v.n; it.chapter = ch; }
}

// ---------------- builders ----------------
const builders = {};

builders.clip = (shot, root) => {
  const first = shot.items[0];
  const phone = first.v.device === "phone";
  const clip = first.v.clip;
  const video = document.createElement("video");
  video.src = `clips/${clip}.mp4`; video.muted = true; video.preload = "auto"; video.playsInline = true;
  let frame, view;
  if (phone) {
    frame = h(`<div class="phone"><div class="screen"></div></div>`);
    view = frame.querySelector(".screen");
    set(video, { left: 0, top: 0, width: "416px", height: "900px" });
    view.appendChild(video);
    root.appendChild(phoneSide(shot, root));
  } else {
    frame = h(`<div class="win"><div class="view"></div></div>`);
    view = frame.querySelector(".view");
    view.appendChild(video);
  }
  root.appendChild(frame);
  // Callouts: short labels that pop in on the word that names them, desktop clips only.
  // They stay until the next callout or the end of the segment.
  const callouts = [];
  if (!phone) {
    for (const it of shot.items) {
      const list = it.v.callouts ?? [];
      const timeOf = (c) => {
        const w = VO[it.id].words.find((x) => new RegExp(c.word, "i").test(x.w));
        if (!w) throw new Error(`callout "${c.text}": no word matching /${c.word}/ in segment ${it.id}`);
        return it.voAt + w.s;
      };
      list.forEach((c, i) => {
        const el = h(`<div class="abs pill" style="right:240px;top:872px;padding:14px 26px 14px 16px;font-size:30px;background:#0a0a0a;color:#fff;box-shadow:0 20px 50px rgb(0 0 0 / .28);opacity:0"><span style="width:34px;height:34px">${icon(c.icon ?? "Check", "#fff", 2.2)}</span>${c.text}</div>`);
        root.appendChild(el);
        const at = timeOf(c);
        callouts.push({ el, at, until: list[i + 1] ? timeOf(list[i + 1]) - 0.15 : it.start + it.dur - 0.35 });
        sfx(at, "pop", 0.5);
      });
    }
  }
  const cam = CLIPS[clip].cam;
  const W = 1488, H = 930;
  shot.videos = [video];
  // Camera keyframes in output time: the clip's framings, but each one held
  // on screen for at least HOLD seconds and eased over MOVE seconds, so
  // fast-forwarded parts don't make the camera hurry.
  const HOLD = 3.0, MOVE = 1.2;
  let outKeys = null;
  const buildKeys = () => {
    const keys = cam?.keys ?? [[0, 0.5, 0.5, 1]];
    const target = (ct) => { let k = keys[0]; for (const x of keys) if (x[0] <= ct) k = x; return k.slice(1); };
    outKeys = [[shot.start, ...target(shot.clipTimeAt(shot.start))]];
    for (let t = shot.start; t < shot.end; t += 0.1) {
      const want = target(shot.clipTimeAt(t)), last = outKeys[outKeys.length - 1];
      const same = want.every((v, i) => Math.abs(v - last[i + 1]) < 0.02);
      if (!same && t - last[0] >= HOLD) outKeys.push([t, ...want]);
    }
  };
  const camAt = (t) => {
    if (!outKeys) buildKeys();
    let i = 0;
    for (let k = 0; k < outKeys.length; k++) if (outKeys[k][0] <= t) i = k;
    const [s0, ...fr] = outKeys[i];
    const prev = i ? outKeys[i - 1].slice(1) : fr;
    // longer moves take longer, so pans never whip across the screen
    const dist = Math.max(Math.abs(fr[0] - prev[0]), Math.abs(fr[1] - prev[1]), Math.abs(fr[2] - prev[2]));
    const e = E.inOutCubic(clamp((t - s0) / clamp(MOVE + dist * 2.5, MOVE, 2.2)));
    return fr.map((v, j) => lerp(prev[j], v, e));
  };
  shot.clipTimeAt = (t) => {
    let it = shot.items.find((x) => t < x.start + x.dur) || shot.items[shot.items.length - 1];
    const lt = Math.max(0, t - it.start);
    let virtual = Math.min(lt * it.rate, it.span);
    for (const [a, b] of it.ivs) { if (virtual <= b - a) return a + virtual; virtual -= b - a; }
    return it.to;
  };
  return (t) => {
    const ct = shot.clipTimeAt(t);
    shot.wantTime = ct;
    for (const c of callouts) {
      const p = E.outBack(P(t, c.at, 0.4)), out = E.inExpo(P(t, c.until, 0.25));
      c.el.style.opacity = P(t, c.at, 0.1) * (1 - out);
      c.el.style.transform = `translateY(${(1 - p) * 30}px) scale(${lerp(0.85, 1, p)})`;
    }
    if (!phone) {
      const [cx0, cy0, z0] = camAt(t);
      let cx = cx0, cy = cy0, z = z0;
      const seg = shot.items.find((x) => t < x.start + x.dur) || shot.items[shot.items.length - 1];
      z = Math.min(z, seg.v.maxZoom ?? 1.25);
      const half = 0.5 / z; cx = clamp(cx, half, 1 - half); cy = clamp(cy, half, 1 - half);
      set(video, { width: `${W * z}px`, height: `${H * z}px`, left: `${W * (0.5 - cx * z)}px`, top: `${H * (0.5 - cy * z)}px` });
      const p = E.outExpo(P(t, shot.start, 0.7));
      frame.style.transform = `translateY(${(1 - p) * 60}px) scale(${lerp(0.97, 1, p)})`;
    } else {
      const p = E.outExpo(P(t, shot.start, 0.8));
      frame.style.transform = `translateY(${(1 - p) * 120}px) rotate(${(1 - p) * 3}deg)`;
    }
  };
};

/** Left-hand panel next to the phone: the learner's steps. */
function phoneSide(shot) {
  const steps = shot.items[0].v.clip === "09-paid"
    ? [["BadgeCheck", "Pembayaran disetujui"], ["Check", "Status: Lunas"], ["GraduationCap", "Mulai belajar"]]
    : [["Link", "Buka link undangan"], ["UserPlus", "Buat akun"], ["Wallet", "Pilih QRIS atau transfer"], ["QrCode", "Scan & bayar"], ["Upload", "Unggah bukti pembayaran"]];
  const idOrder = { c7b: 0, c7c: 1, c7d: 2, c7e: 3, c7f: 4, c8c: 0 };
  const side = h(`<div class="abs" style="left:216px;top:150px;width:860px"></div>`);
  const kick = h(`<div class="kicker"><span class="rule"></span>${shot.items[0].v.clip === "09-paid" ? "Sisi murid" : "Sisi murid · di HP"}</div>`);
  const title = h(`<div class="h1" style="font-size:76px;margin-top:22px">${shot.items[0].v.clip === "09-paid" ? "Kelas siap<br/><span class='muted'>dipelajari.</span>" : "Murid membayar<br/><span class='muted'>dari HP-nya.</span>"}</div>`);
  const list = h(`<div style="margin-top:56px;display:flex;flex-direction:column;gap:16px"></div>`);
  const rows = steps.map(([ic, text], i) => {
    const r = h(`<div style="display:flex;align-items:center;gap:22px;padding:18px 26px;border-radius:22px;font-size:34px;font-weight:500;letter-spacing:-0.02em">
      <span class="icon-box" style="width:58px;height:58px;border-radius:16px;padding:14px"></span><span>${text}</span>
      <span class="mono" style="margin-left:auto;font-size:20px;opacity:.5">0${i + 1}</span></div>`);
    r.ic = r.querySelector(".icon-box"); r.icName = ic;
    list.appendChild(r);
    return r;
  });
  side.append(kick, title, list);
  shot.sideUpdate = (t) => {
    const it = shot.items.find((x) => t < x.start + x.dur) || shot.items[shot.items.length - 1];
    let cur = idOrder[it.id] ?? 0;
    if (shot.items[0].v.clip === "09-paid") cur = Math.min(2, Math.floor(clamp((t - shot.start) / Math.max(1, shot.end - shot.start - 1)) * 3));
    rows.forEach((r, i) => {
      const done = i < cur, active = i === cur;
      r.style.background = active ? "#0a0a0a" : "transparent";
      r.style.color = active ? "#fff" : done ? "#0a0a0a" : "#a3a3a3";
      r.ic.style.background = active ? "rgb(255 255 255 / .14)" : done ? "#0a0a0a" : "#e9e9ea";
      r.ic.innerHTML = icon(done ? "Check" : r.icName, active || done ? "#fff" : "#a3a3a3", 2);
      const p = E.outExpo(P(t, shot.start + 0.3 + i * 0.08, 0.6));
      r.style.opacity = p; r.style.transform = `translateX(${(1 - p) * -40}px)`;
    });
    const p = E.outExpo(P(t, shot.start + 0.1, 0.7));
    kick.style.opacity = p; title.style.opacity = p; title.style.transform = `translateY(${(1 - p) * 30}px)`;
  };
  return side;
}

builders.chapter = (shot, root) => {
  const it = shot.items[0];
  const ch = SB.chapters.find((c) => c.n === it.v.n);
  const total = SB.chapters.length, pad = (n) => String(n).padStart(2, "0");
  root.style.background = "#0a0a0a";
  const big = h(`<div class="abs mono" style="right:120px;top:120px;font-size:520px;font-weight:600;letter-spacing:-0.06em;line-height:.8;color:transparent;-webkit-text-stroke:2px rgb(255 255 255 / .14)">${pad(ch.n)}</div>`);
  const kick = h(`<div class="abs kicker" style="left:160px;top:400px;color:rgb(255 255 255 / .55)"><span class="rule"></span>Langkah ${pad(ch.n)} / ${pad(total)}</div>`);
  const title = h(`<div class="abs h1" style="left:154px;top:450px;font-size:132px;color:#fff;width:1500px"></div>`);
  const spans = wordsReveal(title, ch.title);
  const bar = h(`<div class="abs" style="left:160px;top:660px;width:640px;height:6px;border-radius:3px;background:rgb(255 255 255 / .14)"><div style="height:100%;border-radius:3px;background:#fff;transform-origin:left"></div></div>`);
  root.append(big, kick, title, bar);
  sfx(it.start, "whoosh", 0.9);
  sfx(it.start + 0.25, "impact", 0.55);
  return (t) => {
    const lt = t - it.start;
    const wipe = E.outExpo(clamp(lt / 0.5));
    root.style.clipPath = `inset(0 0 0 ${(1 - wipe) * 100}%)`;
    big.style.transform = `translateX(${(1 - E.outExpo(clamp(lt / 0.9))) * 200 - lt * 18}px)`;
    kick.style.opacity = P(lt, 0.2, 0.3);
    revealWords(spans, lt, 0.25);
    bar.firstElementChild.style.transform = `scaleX(${(ch.n - 1 + E.outExpo(clamp((lt - 0.3) / 0.8))) / total})`;
  };
};

builders.intro = (shot, root) => {
  const it = shot.items[0];
  root.style.background = "#0a0a0a";
  const rings = [0, 1, 2].map(() => { const r = h(`<div class="abs" style="left:960px;top:430px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:3px solid #fff"></div>`); root.appendChild(r); return r; });
  const logo = h(`<img class="abs" src="assets/logo-dark.png" style="left:860px;top:330px;width:200px;height:200px"/>`);
  const word = h(`<div class="abs" style="left:0;right:0;top:540px;text-align:center;color:#fff;font-size:120px;font-weight:600;letter-spacing:-0.06em">hakgyo</div>`);
  const kr = h(`<div class="abs kr" style="left:0;right:0;top:90px;text-align:center;font-size:420px;font-weight:800;color:transparent;-webkit-text-stroke:2px rgb(255 255 255 / .1)">학교</div>`);
  root.append(kr, logo, word);
  // part 2: headline + four steps that land with the voiceover
  const head = h(`<div class="abs h1" style="left:160px;top:250px;font-size:96px;color:#fff;width:1600px"></div>`);
  const spans = wordsReveal(head, it.v.headline ?? "Dari nol sampai murid bayar kelas Anda.");
  const kick = h(`<div class="abs kicker" style="left:160px;top:200px;color:rgb(255 255 255 / .55)"><span class="rule"></span>${it.v.kicker ?? "Demo alur lengkap Hakgyo"}</div>`);
  root.append(kick, head);
  const steps = it.v.steps?.map(([ic, text, re]) => [ic, text, new RegExp(re, "i")]) ?? [["Building2", "Buat organisasi", /organisasi/i], ["BookOpen", "Susun kurikulum", /kurikulum/i], ["UsersRound", "Buka kelas berbayar", /berbayar/i], ["CircleDollarSign", "Murid bayar & belajar", /membayar/i]];
  const cards = steps.map(([ic, text, re], i) => {
    const c = h(`<div class="abs" style="left:${160 + i * 408}px;top:560px;width:384px;height:250px;border-radius:30px;background:#171717;border:1.5px solid #2a2a2a;padding:34px;color:#fff">

  const paths = [0, 1, 2].map((i) => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", `M580 585 C650 585 630 ${395 + i * 190} 700 ${395 + i * 190}`); svg.appendChild(p); p.L = p.getTotalLength(); p.style.strokeDasharray = p.L; return p; });
  const links = [0, 1, 2].map((i) => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", `M1080 ${395 + i * 190} L1125 ${395 + i * 190}`); svg.appendChild(p); p.L = p.getTotalLength(); p.style.strokeDasharray = p.L; return p; });
  root.insertBefore(svg, root.firstChild);
  const tCourse = at(/^course/i), tBab = at(/^bab/i), tItem = at(/^item/i);
  [tCourse, tBab, tItem, ...kinds.map((k) => at(k[3]))].forEach((x) => sfx(x, "pop", 0.7));
  return (t) => {
    const lt = t - it.start;
    kick.style.opacity = P(lt, 0.1, 0.4);
    pop(head, t, it.start + 0.15, { dy: 30, scale: 1 });
    pop(course, t, tCourse);
    rows.forEach((r, i) => pop(r, t, tBab + i * 0.18));
    const draw = (p, s) => { p.style.strokeDashoffset = p.L * (1 - E.inOutCubic(P(t, s, 0.5))); };
    paths.forEach((p, i) => draw(p, tBab - 0.2 + i * 0.18));
    links.forEach((p, i) => draw(p, tItem - 0.2 + i * 0.1));
    chips.forEach((row) => row.forEach((c) => pop(c, t, c.at, { dy: 24 })));
  };
};

// A titled list of cards; each card lands on its spoken word.
builders.list = (shot, root) => {
  const it = shot.items[0];
  const items = it.v.items;
  const kick = h(`<div class="abs kicker" style="left:160px;top:110px"><span class="rule"></span>${it.v.kicker}</div>`);
  const head = h(`<div class="abs h1" style="left:156px;top:150px;font-size:80px;width:1600px">${it.v.title}</div>`);
  root.append(kick, head);
  const step = Math.min(170, 620 / items.length), height = step - 24;
  const cards = items.map(([ic, title, detail, re], i) => {
    const c = h(`<div class="abs card" style="left:160px;top:${330 + i * step}px;width:1600px;height:${height}px;padding:0 36px;display:flex;align-items:center;gap:28px">
      <div class="icon-box" style="width:72px;height:72px;flex:none;padding:18px;background:#0a0a0a">${icon(ic, "#fff", 2)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:40px;font-weight:600;letter-spacing:-0.03em">${title}</div><div style="font-size:26px;color:#737373;margin-top:4px">${detail}</div></div>
      <div class="mono" style="font-size:26px;color:#a3a3a3">${String(i + 1).padStart(2, "0")}</div></div>`);
    c.at = it.voAt + wordAt(it.id, new RegExp(re, "i"));
    root.appendChild(c);
    sfx(c.at, "pop", 0.7);
    return c;
  });
  return (t) => {
    const lt = t - it.start;
    kick.style.opacity = P(lt, 0.1, 0.4);
    pop(head, t, it.start + 0.15, { dy: 30, scale: 1 });
    cards.forEach((c) => pop(c, t, c.at));
  };
};

// Progression modes: Terbuka (everything open) against Bertahap (locked until the previous bab is done).
builders.compare = (shot, root) => {
  const it = shot.items[0];
  const at = (re) => it.voAt + wordAt(it.id, re);
  const kick = h(`<div class="abs kicker" style="left:160px;top:110px"><span class="rule"></span>Progression</div>`);
  const head = h(`<div class="abs h1" style="left:156px;top:150px;font-size:84px">Terbuka atau <span class="muted">bertahap.</span></div>`);
  root.append(kick, head);
  const panel = (x, title, sub, color, locked) => {
    const el = h(`<div class="abs card" style="left:${x}px;top:340px;width:760px;height:600px;padding:40px">
      <div style="font-size:50px;font-weight:600;letter-spacing:-0.04em;color:${color}">${title}</div>
      <div style="font-size:26px;color:#737373;margin-top:6px">${sub}</div>
      <div style="margin-top:34px;display:flex;flex-direction:column;gap:18px">
        ${[1, 2, 3].map((n) => `<div class="pill" style="justify-content:flex-start;width:100%;height:92px;padding:0 26px;border-radius:24px;font-size:32px;border:2px solid var(--border);background:#fafafa">
          <span class="mono" style="font-size:24px;color:#a3a3a3;width:50px">0${n}</span><span style="flex:1">Bab ${n}</span>
          <span class="state" data-n="${n}" style="width:40px;height:40px"></span></div>`).join("")}
      </div></div>`);
    root.appendChild(el);
    return el;
  };
  const open = panel(160, "Terbuka", "Murid bebas membuka semua bab.", "#16a34a");
  const step = panel(1000, "Bertahap", "Bab berikutnya terkunci sampai bab sebelumnya selesai.", "#2563eb");
  open.querySelectorAll(".state").forEach((s) => { s.innerHTML = icon("LockOpen", "#16a34a", 2.2); });
  step.querySelectorAll(".state").forEach((s) => { s.innerHTML = +s.dataset.n === 1 ? icon("LockOpen", "#16a34a", 2.2) : icon("Lock", "#737373", 2.2); s.at = 0; });
  const locks = [...step.querySelectorAll('.state[data-n="2"], .state[data-n="3"]')];
  const tOpen = at(/^Terbuka/i), tStep = at(/^Bertahap/i), tLock = at(/^terkunci/i);
  [tOpen, tStep, tLock].forEach((x) => sfx(x, "pop", 0.7));
  return (t) => {
    const lt = t - it.start;
    kick.style.opacity = P(lt, 0.1, 0.4);
    pop(head, t, it.start + 0.15, { dy: 30, scale: 1 });
    pop(open, t, tOpen); pop(step, t, tStep);
    locks.forEach((l, i) => {
      const p = E.outBack(P(t, tLock + i * 0.25, 0.4));
      l.style.transform = `scale(${lerp(0.4, 1, p)})`;
      l.style.opacity = P(t, tLock + i * 0.25, 0.1);
    });
  };
};

// ---------------- captions, chrome, render ----------------
const capBox = document.querySelector("#caption .box");
let capKey = "";
function chunks(words) {
  const out = []; let cur = [];
  words.forEach((w, i) => {
    cur.push({ ...w, i });
    const len = cur.reduce((s, x) => s + x.w.length + 1, 0);
    if (/[.,?!:]$/.test(w.w) && len > 28 || len > 62) { out.push(cur); cur = []; }
  });
  if (cur.length) out.push(cur);
  return out;
}
function updateCaption(t) {
  const it = TL.find((x) => t >= x.voAt - 0.05 && t < x.voAt + VO[x.id].dur + 0.35);
  if (!it) { capBox.parentElement.style.opacity = 0; return; }
  it.chunks ??= chunks(VO[it.id].words);
  const lt = t - it.voAt;
  let c = it.chunks.find((ch) => lt < ch[ch.length - 1].e + 0.12) || it.chunks[it.chunks.length - 1];
  const key = it.id + ":" + c[0].i;
  if (key !== capKey) { capBox.innerHTML = c.map((w) => `<span data-s="${w.s}">${w.w}</span>`).join(" "); capKey = key; }
  capBox.querySelectorAll("span").forEach((s) => { s.style.color = lt >= +s.dataset.s - 0.02 ? "#fff" : "rgb(255 255 255 / .42)"; });
  const dark = it.v.type === "chapter" || it.v.type === "intro" || it.v.type === "outro";
  capBox.style.background = dark ? "rgb(255 255 255 / .1)" : "rgb(10 10 10 / .86)";
  capBox.parentElement.style.opacity = 1;
}

const tag = document.getElementById("chapterTag"), ff = document.getElementById("ffBadge");
function updateChrome(t) {
  const it = TL.find((x) => t >= x.start && t < x.start + x.dur) || TL[TL.length - 1];
  const desk = it.v.type === "clip" && it.v.device !== "phone";
  if ((it.v.type === "clip") && it.chapter) {
    const ch = SB.chapters.find((c) => c.n === it.chapter);
    const m = it.v.method ? ` · Cara ${it.v.method}: ${METHODS[it.v.method - 1][1]}` : "";
    tag.innerHTML = `<div class="pill mono" style="height:32px;padding:0 16px;font-size:16px;letter-spacing:.12em;background:#0a0a0a;color:#fff">${String(ch.n).padStart(2, "0")} · ${ch.title.toUpperCase()}</div>${m ? `<div class="pill" style="height:32px;padding:0 16px;margin-left:8px;font-size:17px;background:#2563eb;color:#fff">${m.slice(3)}</div>` : ""}`;
    tag.style.display = "flex";
    tag.style.left = it.v.device === "phone" ? "216px" : "216px";
  } else tag.style.display = "none";
  if (it.v.type === "clip" && it.rate > 1.35) {
    ff.innerHTML = `<div class="pill mono" style="height:32px;padding:0 14px 0 10px;font-size:16px;background:#fff;border:1.5px solid #e5e5e5"><span style="width:20px;height:20px">${icon("FastForward", "#0a0a0a", 2)}</span>${(Math.round(it.rate * 2) / 2).toFixed(1)}×</div>`;
    ff.style.display = "block";
    ff.style.right = it.v.device === "phone" ? "266px" : "216px";
  } else ff.style.display = "none";
}

const grain = document.getElementById("grain"), gctx = grain.getContext("2d"), gimg = gctx.createImageData(480, 270);
function drawGrain(frame) {
  let seed = frame * 9973 + 1; const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) { seed = (seed * 16807) % 2147483647; const v = (seed / 2147483647) * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gctx.putImageData(gimg, 0, 0);
}

async function init() {
  await load();
  buildTimeline();
  const layers = document.getElementById("layers");
  for (const shot of SHOTS) {
    const root = h(`<div class="layer"></div>`);
    layers.appendChild(root);
    shot.root = root;
    const type = shot.items[0].v.type;
    shot.update = builders[type](shot, root);
  }
  // transitions between clips get a soft whoosh
  SHOTS.forEach((s, i) => { if (i && s.items[0].v.type === "clip") sfx(s.start, "swipe", 0.5); });
  await document.fonts.load('600 60px Geist');
  await Promise.all(["400 40px NotoKR", "800 100px NotoKR", "400 20px GeistMono"].map((f) => document.fonts.load(f, "학교 0123")));
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  await Promise.all(SHOTS.flatMap((s) => s.videos || []).map((v) => new Promise((r) => (v.readyState >= 2 ? r() : v.addEventListener("loadeddata", r, { once: true })))));
}

window.seek = async (t, frame = Math.round(t * FPS)) => {
  const waits = [];
  SHOTS.forEach((s, i) => {
    const on = t >= s.start && t < s.end + XF;
    s.root.style.display = on ? "block" : "none";
    if (!on) { s.shown = false; return; }
    s.root.style.zIndex = i;
    // incoming shot fades in while the outgoing one clears out quickly
    const fadeIn = i === 0 ? 1 : E.outCubic(P(t, s.start, XF));
    const fadeOut = 1 - E.outCubic(P(t, s.end, XF * 0.55));
    s.root.style.opacity = Math.min(fadeIn, fadeOut);
    s.update(t);
    s.sideUpdate?.(t);
    if (s.videos) {
      const v = s.videos[0];
      const want = Math.min(s.wantTime, v.duration - 0.05);
      const seeking = Math.abs(v.currentTime - want) > 0.001;
      if (seeking || !s.shown) {
        // wait until the frame is actually presented, not just decoded
        const presented = () => new Promise((r) => { v.requestVideoFrameCallback(() => r()); setTimeout(r, 400); });
        const seeked = seeking ? new Promise((r) => v.addEventListener("seeked", r, { once: true })) : Promise.resolve();
        // a freshly shown layer needs one presented frame; later seeks only need "seeked"
        waits.push(s.shown ? seeked : seeked.then(presented));
        if (seeking) v.currentTime = want;
      }
      s.shown = true;
    }
  });
  document.getElementById("blob1").style.transform = `translate(${Math.sin(t * 0.2) * 80}px, ${Math.cos(t * 0.15) * 60}px)`;
  document.getElementById("blob2").style.transform = `translate(${Math.cos(t * 0.17) * 90}px, ${Math.sin(t * 0.13) * 50}px)`;
  updateCaption(t);
  updateChrome(t);
  drawGrain(frame);
  await Promise.all(waits);
};

window.ready = init().then(() => {
  window.__shots = SHOTS;
  window.DURATION = DURATION;
  window.TIMELINE = { duration: DURATION, segments: TL.map((x) => ({ id: x.id, type: x.v.type, start: +x.start.toFixed(3), dur: +x.dur.toFixed(3), voAt: +x.voAt.toFixed(3), file: VO[x.id].file })), sfx: SFX };
  return true;
});
</script>
